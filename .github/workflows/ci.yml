name: CI / 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: 检出仓库 / Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 pnpm / Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.20.0

      - name: 安装 Node.js / Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 运行仓库检查 / Run repository checks
        run: pnpm check

      - name: 构建并验证开发签名的 Claude Desktop 扩展 / Build and verify dev-signed Claude Desktop extension
        run: pnpm package:claude-desktop:dev-signed

      - name: 审计生产依赖 / Audit production dependencies
        run: pnpm audit:prod

      - name: 检查 PR 提交信息 / Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
