name: 功能建议 / Feature request
description: 建议新能力或改进现有行为 / Propose a capability or behavior improvement
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        请描述要解决的用户问题，而不只是指定实现方式；提交前请核对 README 中的当前边界与路线图。
        Describe the user problem, not only an implementation, and review the current boundaries and roadmap in README first.
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查 / Pre-submission checks
      options:
        - label: 我已搜索现有 Issue 和路线图，未找到相同建议。 / I searched existing issues and the roadmap and found no duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 用户问题 / User problem
      description: 谁在什么场景遇到什么阻碍？当前方案为什么不足？ / Who is blocked, in what context, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果 / Desired outcome
      description: 描述可观察、可验收的结果，不要求预先确定内部实现。 / Describe an observable, testable outcome without prescribing internals.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要范围 / Primary area
      options:
        - 协议与领域层 / Protocol and domain
        - 编排器 / Orchestrator
        - Blender 扩展 / Blender Extension
        - Blender MCP 桥接 / Blender MCP Bridge
        - 新宿主适配器 / New host adapter
        - 文档或开发体验 / Documentation or developer experience
        - 跨组件 / Cross-component
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 可选方案 / Optional proposal
      description: 如有建议，请说明方案、替代选择和取舍。 / If you have an idea, describe alternatives and trade-offs.
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 添加示例、草图、相关链接、兼容性或安全约束。 / Add examples, sketches, links, compatibility notes, or security constraints.
